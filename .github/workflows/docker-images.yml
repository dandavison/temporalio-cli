name: Build docker image
on:
  workflow_dispatch:

jobs:
  build-image:
    name: Build docker image
    runs-on: ubuntu-latest
    env:
      REPO_URL: ${{ github.event.pull_request.head.repo.html_url }}
    steps:
      - name: Print build information
        run: 'echo head_ref: "$GITHUB_HEAD_REF", ref: "$GITHUB_REF", triggering sha: ${{ github.sha }}'

      - name: Checkout repo
        uses: actions/checkout@v4


      - uses: actions/setup-go@v4
        with:
          go-version: '^1.20'

      - name: Lint dockerfile
        run: docker run --rm -i hadolint/hadolint < .Dockerfile

      - name: Build docker image
        shell: bash
        run: |
          docker build --pull \
            --tag temporalio/cli:1.21.0 \
            --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --label org.opencontainers.image.source=https://github.com/temporalio/cli \
            --label org.opencontainers.image.vendor=Temporal Technologies Inc. \
            --label org.opencontainers.image.authors=Temporal Maintainers <cli@temporal.io> \
            --label org.opencontainers.image.licenses=MIT \
            --label org.opencontainers.image.title=Temporal CLI \
            --label org.opencontainers.image.documentation=https://github.com/temporalio/cli/blob/main/README.md \
            --label org.opencontainers.image.version=1.21.0 \
            --label io.temporal.cli.version=1.21.0 \
            .

      - name: Prepare docker artifact
        run: |
          echo -n "${{env.SAVED_IMAGE_TAG}}" > /tmp/image_tag

      - name: Upload docker artifacts
        # Access download url at ${{ steps.artifact-upload.outputs.artifact-url }}
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: cli-docker-image
          path: |
            /tmp/image.tar
            /tmp/image_tag

      - name: Login to DockerHub
        uses: docker/login-action@v2
        if: inputs.do-push && !github.event.pull_request.head.repo.fork
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Push image to DockerHub
        if: inputs.do-push && !github.event.pull_request.head.repo.fork
        run: go run ./cmd push-images
